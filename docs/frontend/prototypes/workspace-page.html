<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreamPump · 工作台原型 v1</title>
<style>
  :root{--text:#f5f7fb;--muted:#93a2bb;--faint:#7486a1;--brand:#de402a;--s1:#67b8ff;--s2:#65ecaf;--up:#2fbf71;--energy:#f0a070;--energy-soft:#f5b8ab;--ok:#7ce0b0;--pill:80px;--ease:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{display:flex;min-height:100vh;color:var(--text);
    background:radial-gradient(circle at 16% 6%,rgba(64,90,150,.16),transparent 26%),radial-gradient(circle at 84% 4%,rgba(34,74,140,.1),transparent 22%),radial-gradient(circle at 60% 98%,rgba(222,64,42,.06),transparent 22%),linear-gradient(180deg,#090d14,#0a1018);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  .muted{color:var(--muted)}.faint{color:var(--faint)}.num{font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:20px}

  /* slim icon rail */
  .rail{width:72px;flex:none;border-right:1px solid rgba(255,255,255,.06);background:rgba(9,13,20,.6);backdrop-filter:blur(20px);
    display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:14px;position:sticky;top:0;height:100vh}
  .rail .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(150deg,#de402a,#f0795f);display:grid;place-items:center;font-weight:800;box-shadow:0 8px 22px rgba(222,64,42,.34)}
  .ni{position:relative;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:19px;cursor:pointer;color:var(--faint);transition:.16s}
  .ni:hover{background:rgba(255,255,255,.05);color:#fff}
  .ni.on{background:rgba(255,255,255,.1);color:#fff}
  .ni .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#de7a2a;border:1.5px solid #0a0f17}
  .ni .tip{position:absolute;left:52px;white-space:nowrap;font-size:12px;padding:4px 9px;border-radius:8px;background:rgba(20,27,40,.96);border:1px solid rgba(255,255,255,.1);opacity:0;pointer-events:none;transition:.15s}
  .ni:hover .tip{opacity:1}
  .rail .me{margin-top:auto;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:linear-gradient(135deg,#2a3346,#161f2c)}

  .main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:28px 36px 80px}
  h1.page{font-size:26px;font-weight:800;letter-spacing:-.4px}
  .panel{border-radius:18px;background:linear-gradient(180deg,rgba(20,28,41,.84),rgba(11,16,25,.8));border:1px solid rgba(255,255,255,.07)}
  .cta{height:48px;padding:0 26px;border-radius:var(--pill);display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(180deg,#f05540,#de402a);box-shadow:0 14px 30px rgba(222,64,42,.3)}
  .cta.sm{height:42px;padding:0 22px;font-size:14px;box-shadow:none}
  .bar{height:7px;border-radius:30px;background:rgba(255,255,255,.09);overflow:hidden}.bar>i{display:block;height:100%;border-radius:30px}
  .vsep{width:1px;height:36px;background:rgba(255,255,255,.08)}

  .banner{margin-top:16px;border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:22px;background:linear-gradient(180deg,rgba(20,28,41,.84),rgba(11,16,25,.8));border:1px solid rgba(255,255,255,.07)}
  .banner .k{font-size:11px;color:var(--faint)}.banner .v{font-size:16px;font-weight:700;margin-top:2px}
  .alert{margin-top:14px;border-radius:14px;padding:12px 16px;background:rgba(222,64,42,.1);border:1px solid rgba(222,64,42,.3);display:flex;align-items:center;gap:12px;cursor:pointer}
  .next{margin-top:14px;border-radius:18px;padding:20px;background:linear-gradient(160deg,rgba(222,64,42,.1),rgba(255,255,255,.03));border:1px solid rgba(222,64,42,.28);display:flex;align-items:center;gap:18px}
  .stats{display:flex;gap:12px;margin-top:16px}
  .stat{flex:1;border-radius:14px;padding:14px 16px;background:linear-gradient(180deg,rgba(20,28,41,.7),rgba(11,16,25,.66));border:1px solid rgba(255,255,255,.06)}
  .stat .k{font-size:11px;color:var(--faint)}.stat .v{font-size:21px;font-weight:800;margin-top:3px}
  .row-h{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}
  .post{display:flex;align-items:center;gap:13px;border-radius:12px;padding:11px 13px;background:linear-gradient(180deg,rgba(20,28,41,.6),rgba(11,16,25,.56))}
  .post .th{width:62px;height:40px;border-radius:7px;flex:none}
  .post .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .post .m{font-size:10.5px;color:var(--faint);margin-top:2px}
  .sp{font-size:10px;font-weight:600;padding:2px 9px;border-radius:30px;white-space:nowrap;border:1px solid}
  .sp.pub{color:var(--ok);background:rgba(101,236,175,.14);border-color:rgba(101,236,175,.34)}
  .sp.proc{color:#e0b070;background:rgba(224,162,58,.14);border-color:rgba(224,162,58,.34)}
  .sp.pend{color:#e0b070;background:rgba(224,162,58,.14);border-color:rgba(224,162,58,.34)}

  .steps{display:flex;align-items:center;gap:10px;margin:20px 0 24px}
  .st{display:flex;align-items:center;gap:8px}
  .st .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
  .st .l{font-size:13px;font-weight:600}
  .st-line{flex:1;height:1.5px;min-width:40px}
  .drop{border:2px dashed rgba(255,255,255,.2);border-radius:16px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;background:rgba(255,255,255,.02);text-align:center}
  .drop:hover{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.03)}
  .fld label{font-size:11px;color:var(--faint)}
  .fld input,.fld textarea{width:100%;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(0,0,0,.22);padding:11px 13px;font-size:13.5px;color:#f5f7fb;outline:none;margin-top:5px}
  .fld textarea{min-height:80px;resize:vertical}
  .fld input:focus,.fld textarea:focus{border-color:rgba(222,64,42,.45)}
  .tagc{font-size:12px;border-radius:80px;padding:4px 13px;cursor:pointer;border:1px solid}
  .ghost{height:42px;padding:0 20px;border-radius:80px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);display:inline-flex;align-items:center;font-size:13px;cursor:pointer}
  .nextbtn{height:42px;padding:0 24px;border-radius:80px;background:rgba(255,255,255,.92);color:#0a0f17;display:inline-flex;align-items:center;font-size:14px;font-weight:700;cursor:pointer}
  .sumrow{display:flex;justify-content:space-between;font-size:13px}
  .lock-note{border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(0,0,0,.18);padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.55}
  .preview{width:288px;flex:none}
  .pcard{border-radius:14px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1)}

  .tabs2{display:flex;gap:14px;margin:18px 0}
  .tabs2 .t{font-size:13px;color:var(--faint);padding-bottom:7px;cursor:pointer}
  .tabs2 .t.on{font-weight:700;color:#fff;border-bottom:2px solid #de402a}
  .opp{border-radius:14px;padding:15px;cursor:pointer;display:flex;align-items:center;gap:13px}
  .opp .ic{width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:19px}
  .od-ic{width:48px;height:48px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:21px}
  .od-r{width:308px;flex:none;position:sticky;top:20px}
  .bpanel{border-radius:18px;padding:18px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .ready{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:10px;color:#e6c98a;background:rgba(224,162,58,.1);border:1px solid rgba(224,162,58,.26);border-radius:80px;padding:5px 0;text-align:center}

  .chart{display:block;width:100%;height:80px}
  /* analytics */
  .a-head{display:flex;align-items:center;gap:13px}
  .a-th{width:74px;height:48px;border-radius:9px;flex:none}
  .hot-badge{font-size:10px;font-weight:700;color:#ffcaa0;background:rgba(222,64,42,.16);border:1px solid rgba(222,64,42,.4);border-radius:30px;padding:2px 9px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{border-radius:12px;padding:12px 14px;background:linear-gradient(180deg,rgba(20,28,41,.7),rgba(11,16,25,.66));border:1px solid rgba(255,255,255,.06)}
  .kpi .k{font-size:10.5px;color:var(--faint)}.kpi .v{font-size:20px;font-weight:800;margin-top:3px}
  .upsell{border-radius:16px;padding:14px 18px;background:linear-gradient(160deg,rgba(240,160,112,.12),rgba(255,255,255,.03));border:1px solid rgba(240,160,112,.3);display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .agrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.agrid{grid-template-columns:1fr}}
  .apanel{border-radius:16px;padding:16px;background:linear-gradient(180deg,rgba(20,28,41,.7),rgba(11,16,25,.66));border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden}
  .apanel.wide{grid-column:1/-1}
  .apanel h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
  .apanel .cap{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.55}
  .rng{display:flex;gap:6px;margin-left:auto}
  .rng .r{font-size:11px;padding:4px 10px;border-radius:30px;cursor:pointer;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  .rng .r.on{color:#fff;background:rgba(255,255,255,.1)}
  .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(9,13,20,.5);backdrop-filter:blur(7px);cursor:pointer}
  .lock .pill{font-size:11px;font-weight:700;color:#0a0f17;background:linear-gradient(180deg,#fbd38a,#f0a070);border-radius:80px;padding:8px 16px}
  .pct-track{height:10px;border-radius:30px;background:linear-gradient(90deg,rgba(101,236,175,.18),rgba(224,162,58,.18),rgba(222,64,42,.18));position:relative;margin-top:7px}
  .pct-track .mk{position:absolute;top:-4px;width:4px;height:18px;border-radius:3px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.55)}
  .funnel-row{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:12px}
  .funnel-row .lab{width:52px;color:var(--muted)}
  .tr-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px}
  .tr-row .lab{width:44px;color:var(--muted)}.tr-row .tb{flex:1;height:8px;border-radius:30px;background:rgba(255,255,255,.08);overflow:hidden}.tr-row .tb>i{display:block;height:100%;background:linear-gradient(90deg,#67b8ff,#65ecaf)}
  .hotstrip{height:11px;border-radius:30px;background:rgba(255,255,255,.06);position:relative;margin-top:12px}
  .hotstrip>i{position:absolute;top:0;bottom:0;border-radius:30px;background:linear-gradient(90deg,#f0795f,#de402a)}
  .plan-sw{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint)}
  .plan-sw .pc{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:30px;cursor:pointer;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  .plan-sw .pc.on{color:#0a0f17;background:linear-gradient(180deg,#fbd38a,#f0a070);border-color:transparent}
  .pmodal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(6,9,14,.8);backdrop-filter:blur(10px)}
  .pmodal.show{display:flex}
  .pbox{width:100%;max-width:960px;max-height:92vh;overflow:auto;border-radius:24px;padding:24px;background:linear-gradient(180deg,rgba(18,25,37,.98),rgba(10,15,23,.99));border:1px solid rgba(255,255,255,.1);box-shadow:0 40px 120px rgba(0,0,0,.5)}
  .bill-toggle{display:inline-flex;border-radius:80px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);padding:3px}
  .bill-toggle .b{padding:7px 14px;border-radius:80px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
  .bill-toggle .b.on{background:rgba(255,255,255,.12);color:#fff}
  .tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  @media(max-width:840px){.tiers{grid-template-columns:repeat(2,1fr)}}
  .tier{border-radius:16px;padding:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column}
  .tier.pop{border:2px solid rgba(91,155,239,.6);background:rgba(255,255,255,.05)}
  .tier .nm{font-size:15px;font-weight:800}
  .tier .price{font-size:26px;font-weight:800;margin-top:8px}
  .tier .strike{font-size:12px;color:#7486a1;text-decoration:line-through}
  .tier .feat{font-size:11.5px;color:#cbd5e6;margin-top:8px;line-height:1.75;flex:1}
  .tier .pick{margin-top:12px;height:40px;border-radius:80px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer}
  .promo-badge{font-size:10px;font-weight:800;color:#fff;background:#de402a;border-radius:30px;padding:2px 8px}
  .pop-badge{font-size:10px;font-weight:800;color:#0a0f17;background:linear-gradient(180deg,#bcd6ff,#5b9def);border-radius:30px;padding:2px 8px}

  .toast{position:fixed;bottom:32px;left:calc(50% + 36px);transform:translateX(-50%);z-index:80;padding:13px 22px;border-radius:80px;background:linear-gradient(180deg,rgba(28,38,54,.96),rgba(16,22,33,.96));border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(0,0,0,.5);font-size:14px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:.3s var(--ease)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  @media(max-width:900px){.stats{flex-wrap:wrap}.preview{display:none}.od-r{width:100%;position:static}}
</style>
</head>
<body>

<div class="rail">
  <div class="logo">S</div>
  <div class="ni" id="ni-home" onclick="go('home')">🏠<span class="tip">首页</span></div>
  <div class="ni" id="ni-content" onclick="go('content')">🎬<span class="tip">内容</span></div>
  <div class="ni" id="ni-opps" onclick="go('opps')">📨<span class="dot" id="opp-dot"></span><span class="tip">机会</span></div>
  <div class="ni" id="ni-data" onclick="go('data')">📊<span class="tip">数据</span></div>
  <div class="me"></div>
</div>

<div class="main" id="view"></div>
<div class="pmodal" id="pmodal" onclick="if(event.target===this)closePro()"><div class="pbox" id="pricing-box"></div></div>
<div class="toast" id="toast"></div>

<script>
  var TAGS=['#插画','#京都','#绘本','#手绘','#日常'];
  var state={view:'home',step:1,title:'',desc:'',tags:{'#插画':true,'#京都':true},
    posts:[
      {id:'c1',title:'京都四季绘本 · 夏日祭典手稿',meta:'图文 · 2 天前',status:'published',perf:'♡ 2.4k · 💬 128',a:'rgba(184,144,255,.36)',b:'rgba(63,182,168,.3)'},
      {id:'c2',title:'春日临摹小练习',meta:'图文 · 6 天前',status:'published',perf:'♡ 1.1k · 💬 64',a:'rgba(74,108,212,.32)',b:'rgba(184,144,255,.28)'},
      {id:'c3',title:'夏日祭典 · 线稿合集',meta:'系统正在处理上链存证…',status:'processing',perf:'即将发布',a:'rgba(222,64,42,.3)',b:'rgba(184,144,255,.26)'}
    ],
    opps:[
      {id:'buyout',kind:'buyout',sponsor:'NovaPlay',title:'NovaPlay 想出资助你毕业、进入 S2 赞助',sub:'毕业赞助 $10,000 · 3 天内回复',deadline:'3 天',status:'pending'},
      {id:'sp1',kind:'sponsor',sponsor:'NovaPlay',title:'第二章发售联动 · 一支预告短片 + 图文',sub:'保底 $4,000 + 表现奖金 · 7 天内',deadline:'7 天',status:'pending'}
    ],
    selectedOpp:null,signed:{},analyticsId:null,playRange:'7d',billing:'annual',promo:true,plan:'free'};

  function hero(a,b){return 'linear-gradient(135deg,'+a+','+b+')';}
  function progEl(pct,fill){return '<div class="bar"><i style="width:'+pct+'%;background:'+fill+'"></i></div>';}
  function statusPill(st){var m={published:['已发布','pub'],processing:['处理中','proc'],pending:['待处理','pend']}[st]||['已发布','pub'];return '<span class="sp '+m[1]+'">'+m[0]+'</span>';}
  function postRow(p){return '<div class="post" style="cursor:pointer;border:1px solid '+(p.status==='processing'?'rgba(224,162,58,.3)':'rgba(255,255,255,.06)')+'" onclick="openAnalytics(\''+p.id+'\')">'
    +'<div class="th" style="background:'+hero(p.a,p.b)+'"></div><div style="flex:1;min-width:0"><div class="t">'+p.title+'</div><div class="m">'+p.meta+'</div></div>'
    +statusPill(p.status)+'<div style="font-size:11px;color:#7486a1;width:104px;text-align:right">'+p.perf+'</div></div>';}

  /* ---------- HOME ---------- */
  function renderHome(){
    var pending=state.opps.filter(function(o){return o.status==='pending';});
    var stats=[['本周新增应援','+48','color:#f5b8ab'],['本周播放','2.3万',''],['新增粉丝','+312',''],['总应援人数','312','']];
    var h='<h1 class="page">下午好，@studio_haru 👋</h1>'
      +'<div class="banner"><div><div class="k">当前阶段</div><div class="v" style="color:#67b8ff">● S1 发现期</div></div><div class="vsep"></div>'
        +'<div><div class="k">势能</div><div class="v">71 <span style="font-size:12px;color:#2fbf71">↗ +9</span></div></div><div class="vsep"></div>'
        +'<div style="flex:1"><div class="k">距离毕业 64%</div><div style="margin-top:6px">'+progEl(64,'linear-gradient(90deg,#67b8ff,#de7a2a)')+'</div></div></div>';
    if(pending.length){
      h+='<div class="alert" onclick="go(\'opps\')"><span style="font-size:18px">📨</span><div style="flex:1"><span style="font-size:13.5px;font-weight:700">你有 '+pending.length+' 个新机会待处理</span> <span style="font-size:12px;color:#93a2bb">· NovaPlay 想合作</span></div><span style="font-size:13px;color:#f5b8ab;font-weight:600">去查看 →</span></div>';
    }
    h+='<div class="next"><div style="font-size:30px">🎬</div><div style="flex:1"><div style="font-size:11px;color:#f0a08f;letter-spacing:1px">现在该做的 · NEXT</div>'
      +'<div style="font-size:18px;font-weight:700;margin-top:3px">本周再发 2 条，保持势能上升</div>'
      +'<div style="font-size:12.5px;color:#93a2bb;margin-top:3px">你已连续 3 周稳定更新，距离触发赞助商出资助你毕业只差一点。</div></div>'
      +'<div class="cta" onclick="goCompose()">+ 发内容</div></div>'
      +'<div class="stats">'+stats.map(function(s){return '<div class="stat"><div class="k">'+s[0]+'</div><div class="v" style="'+s[2]+'">'+s[1]+'</div></div>';}).join('')+'</div>'
      +'<div class="row-h"><div style="font-size:15px;font-weight:700">最近内容</div><div style="font-size:12.5px;color:#93a2bb;cursor:pointer" onclick="go(\'content\')">查看全部 →</div></div>'
      +'<div style="display:flex;flex-direction:column;gap:9px">'+state.posts.slice(0,3).map(postRow).join('')+'</div>';
    document.getElementById('view').innerHTML=h;
  }

  /* ---------- CONTENT ---------- */
  function renderContent(){
    document.getElementById('view').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:24px;font-weight:800">内容 <span style="font-size:14px;color:#7486a1;font-weight:600">'+state.posts.length+' 条</span></div><div class="cta sm" onclick="goCompose()">+ 发内容</div></div>'

  var _svgN=0;
  function gen(seed,n,lo,hi){var v=(lo+hi)/2,out=[];for(var i=0;i<n;i++){v+=(((i*9+seed)%7)-2.4)*((hi-lo)/22);v=Math.max(lo,Math.min(hi,v));out.push(Math.round(v));}return out;}
  function svgArea(vals,color,h){_svgN++;var id='ar'+_svgN;var n=vals.length;var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);var rg=Math.max(1,mx-mn);
    var co=vals.map(function(p,i){return [(300*i/(n-1)),(100-((p-mn)/rg)*86-7)];});
    var line=co.map(function(c){return c[0].toFixed(1)+','+c[1].toFixed(1);}).join(' ');var last=co[co.length-1];
    return '<svg viewBox="0 0 300 100" preserveAspectRatio="none" style="display:block;width:100%;height:'+(h||120)+'px"><defs><linearGradient id="'+id+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity="0.26"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
      +'<polygon points="0,100 '+line+' 300,100" fill="url(#'+id+')"/><polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="'+color+'" vector-effect="non-scaling-stroke"/></svg>';
  }
  function svgFollowers(seed){
    var n=30,v=70,vals=[];for(var i=0;i<n;i++){v+=Math.max(0,((i*7+seed)%5)+(i%8===0?13:1));vals.push(v);}
    var mx=vals[n-1];var co=vals.map(function(p,i){return [(300*i/(n-1)),(100-(p/mx)*84-8)];});
    var line=co.map(function(c){return c[0].toFixed(1)+','+c[1].toFixed(1);}).join(' ');
    var pub=[5,12,20,26],hi=20;
    var marks=pub.map(function(ix){var c=co[ix];var big=ix===hi;return '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="'+(big?4.2:2.6)+'" fill="'+(big?'#de402a':'#9fb4d0')+'" stroke="#0a0f17" stroke-width="1.2" vector-effect="non-scaling-stroke"/>';}).join('');
    _svgN++;var id='fl'+_svgN;
    return '<svg viewBox="0 0 300 100" preserveAspectRatio="none" style="display:block;width:100%;height:128px"><defs><linearGradient id="'+id+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#67b8ff" stop-opacity="0.2"/><stop offset="1" stop-color="#67b8ff" stop-opacity="0"/></linearGradient></defs>'
      +'<polygon points="0,100 '+line+' 300,100" fill="url(#'+id+')"/><polyline points="'+line+'" fill="none" stroke="#67b8ff" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'+marks+'</svg>';

    growth:{nm:'Growth',sub:'成长',mo:25,anmo:20.83,anTot:250,pMo:15.00,pAnmo:12.50,pAnTot:150,pop:true,feats:['Starter 全部','+ 🏅 同类 percentile','+ ⏱️ 留存曲线','+ 🕗 最佳发布时间','+ ⚡ 应援转化漏斗']},
    studio:{nm:'Studio',sub:'专业',mo:49,anmo:40.83,anTot:490,pMo:29.40,pAnmo:24.50,pAnTot:294,feats:['Growth 全部','+ 🔁 账号级 / 多内容对比','+ ⬇️ CSV 导出 & 全量历史','+ 🔌 API / 优先支持']}
  };
  function locked(t){return LV[state.plan]<LV[t];}

  function lockEl(t){if(!locked(t))return '';return '<div class="lock" onclick="openPro()"><div style="font-size:20px">🔒</div><div class="pill">'+TIER_NAME[t]+' 解锁 · '+TIER_FROM[t]+'/月起</div></div>';}
  function setPlan(t){state.plan=t;renderAnalytics();}
  /* pricing modal */
  function fmtP(v){return v%1===0?'$'+v:'$'+v.toFixed(2);}
  function openPro(){renderPricing();document.getElementById('pmodal').classList.add('show');}
  function closePro(){document.getElementById('pmodal').classList.remove('show');}
  function setBilling(b){state.billing=b;renderPricing();}
  function togglePromo(){state.promo=!state.promo;renderPricing();}
  function choosePlan(t){state.plan=t;closePro();flash(t==='free'?'已切换到免费版':'已选择 '+TIER_NAME[t]+'（演示，未接支付）');renderAnalytics();}
  function renderPricing(){
    var an=state.billing==='annual',promo=state.promo;

      +'<span style="font-size:18px">🔥</span><div style="flex:1"><div style="font-size:12.5px;font-weight:700;color:#f5b8ab">限时 6 折 · 早鸟名额 <span class="num">312 / 500</span> 已领</div>'
      +'<div style="height:6px;border-radius:30px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px"><i style="display:block;width:62%;height:100%;background:linear-gradient(90deg,#f0795f,#de402a);border-radius:30px"></i></div></div>'
      +'<div style="font-size:11px;color:#f0a08f;white-space:nowrap;text-align:right">锁定首年 6 折<br>剩 5 天</div></div>':'';
    var cards=['free','starter','growth','studio'].map(function(k){
      var t=TIERS[k],ph;
      if(k==='free'){ph='<div class="price">$0<span style="font-size:12px;color:#7486a1">/月</span></div><div style="font-size:11px;color:#7486a1;margin-top:4px">永久免费</div>';}
      else{
        var perMo=an?(promo?t.pAnmo:t.anmo):(promo?t.pMo:t.mo);
        var sub=promo?'<span class="strike">'+fmtP(t.mo)+'/月</span> <span class="promo-badge">省 '+(an?'50%':'40%')+'</span>':'';
        var ann=an?'按年 '+fmtP(promo?t.pAnTot:t.anTot)+'/年 · 2 个月免费':'或按年低至 '+fmtP(promo?t.pAnmo:t.anmo)+'/月';
        ph='<div class="price">'+fmtP(perMo)+'<span style="font-size:12px;color:#7486a1">/月</span></div><div style="font-size:11px;margin-top:3px;min-height:16px">'+sub+'</div><div style="font-size:11px;color:#7486a1;margin-top:4px">'+ann+'</div>';

      var cur=state.plan===k;

    document.getElementById('pricing-box').innerHTML=

      +'<div style="margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
        +'<div class="bill-toggle"><div class="b'+(!an?' on':'')+'" onclick="setBilling(\'monthly\')">按月</div><div class="b'+(an?' on':'')+'" onclick="setBilling(\'annual\')">按年 · 省17%</div></div>'
        +'<div style="font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:30px;cursor:pointer;'+(promo?'color:#fff;background:#de402a;border:1px solid transparent':'color:#93a2bb;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)')+'" onclick="togglePromo()">限时 6 折 · 早鸟</div>'

  function openAnalytics(id){var p=state.posts.find(function(x){return x.id===id;});if(!p)return;if(p.status==='processing'){flash('数据生成中 · 发布完成后即可查看');return;}state.analyticsId=id;state.view='analytics';renderView();}
  function setRange(r){state.playRange=r;renderAnalytics();}

  function renderAnalytics(){
    var p=state.posts.find(function(x){return x.id===state.analyticsId;});if(!p){go('content');return;}
    var seed=(state.analyticsId.charCodeAt(state.analyticsId.length-1)||5)%9+2;
    var rng=state.playRange;
    var pv=rng==='24h'?gen(seed,24,38,96):rng==='7d'?gen(seed,8,30,92):gen(seed,30,22,97);
    var playCap=rng==='24h'?'24 小时新增 3,120 播放 · 峰值在发布后 4 小时':(rng==='7d'?'7 天累计 4.2 万播放 · 日均约 6,000':'全周期 4.2 万播放 · 仍在缓慢增长');
    var kpis=[['总播放','4.2万'],['24h 播放','+3.1k'],['点赞','2.4k'],['评论','128'],['带来应援','+37 ⚡']];
    var ret=[100,86,79,73,69,65,62,60,58,57,56,55];

    var fcol=['#67b8ff','#4a9be0','#f0a070','#f0795f','#de402a'];
    var tr=[['推荐',62],['关注',21],['搜索',9],['外部',8]];

    var head='<div style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#93a2bb;cursor:pointer;margin-bottom:14px" onclick="go(\'content\')">← 返回内容</div>'
      +'<div class="a-head"><div class="a-th" style="background:'+hero(p.a,p.b)+'"></div>'
        +'<div style="flex:1;min-width:0"><div style="font-size:18px;font-weight:800;line-height:1.25">'+p.title+'</div>'
        +'<div style="font-size:11.5px;color:#7486a1;margin-top:3px">图文 · 9 图 · 2 天前 · <span class="hot-badge">🔥 上过热门</span></div></div>'
        +'<div class="plan-sw"><span>演示档位</span>'+['free','starter','growth','studio'].map(function(t){return '<div class="pc'+(state.plan===t?' on':'')+'" onclick="setPlan(\''+t+'\')">'+TIER_NAME[t]+'</div>';}).join('')+'</div></div>'
      +'<div class="kpis">'+kpis.map(function(k){return '<div class="kpi"><div class="k">'+k[0]+'</div><div class="v">'+k[1]+'</div></div>';}).join('')+'</div>';

    var upsell=state.plan!=='free'?'':'<div class="upsell"><span style="font-size:22px">📊</span><div style="flex:1"><div style="font-size:13.5px;font-weight:700">StreamPump Pro · 创作者洞察 <span class="promo-badge">限时 6 折 · 早鸟</span></div><div style="font-size:11.5px;color:#d8c4a0;line-height:1.5">Growth 解锁 同类排名 / 留存 / 最佳发布时间 / ⚡应援漏斗 · Starter 解锁 涨粉归因 / 流量来源</div></div>'
      +'<div style="text-align:right"><div style="font-size:16px;font-weight:800;color:#ffd9a0">$12.50<span style="font-size:11px;color:#c9b48f">/月起</span></div><div style="font-size:10px;color:#c9b48f"><span style="text-decoration:line-through">$25</span> Growth 年付 6 折</div></div>'
      +'<div class="cta sm" style="height:38px" onclick="openPro()">查看方案</div></div>';

    var pPlay='<div class="apanel wide"><h3>📈 播放曲线<div class="rng">'
        +['24h','7d','all'].map(function(r){var lbl=r==='24h'?'24 小时':r==='7d'?'7 天':'全部';return '<div class="r'+(rng===r?' on':'')+'" onclick="setRange(\''+r+'\')">'+lbl+'</div>';}).join('')+'</div></h3>'
      +svgArea(pv,'#2fbf71',130)+'<div class="cap">'+playCap+'</div></div>';
    var pHot='<div class="apanel"><h3>🔥 热门记录</h3>'
      +'<div style="font-size:13px;margin-top:10px"><b style="color:#ffcaa0">上过热门 ✓</b> · 【发现榜 · 艺术】</div>'
      +'<div style="font-size:11.5px;color:#93a2bb;margin-top:6px">持续 <b style="color:#fff">14 小时</b> · 6/21 14:00 → 6/22 04:00 · 最高位 <b style="color:#fff">#6</b></div>'
      +'<div class="hotstrip"><i style="left:30%;width:24%"></i></div>'

    var pFol='<div class="apanel wide"><h3>👥 涨粉归因事件线 '+tierBadge('starter')+'</h3>'+svgFollowers(seed)
      +'<div class="cap"><span style="color:#de8a78">● 红点 = 这条内容</span> · 灰点 = 其它发布节点。这条发布后 7 天带来 <b style="color:#fff">+182 粉丝</b>，是同期单条最高。</div>'+lockEl('starter')+'</div>';
    var pPct='<div class="apanel"><h3>🏅 同类横向排名 '+tierBadge('growth')+'</h3>'
      +'<div style="font-size:11.5px;color:#93a2bb;margin-top:8px">对比同类目「插画 · 图文」近 90 天内容</div>'
      +pctRow('播放量',87)+pctRow('互动率',92)+pctRow('完播 / 看完率',78)+'<div class="cap">综合 <b style="color:#7ce0b0">Top 11%</b>，互动率尤其突出。</div>'+lockEl('growth')+'</div>';
    var pRet='<div class="apanel"><h3>⏱️ 观看留存曲线 '+tierBadge('growth')+'</h3>'+svgArea(ret,'#67b8ff',110)+'<div class="cap">平均看完 <b style="color:#fff">62%</b> · 前 3 秒流失 14%（可优化开头）。</div>'+lockEl('growth')+'</div>';
    var pTr='<div class="apanel"><h3>🌐 流量来源 '+tierBadge('starter')+'</h3><div style="margin-top:6px">'
      +tr.map(function(t){return '<div class="tr-row"><span class="lab">'+t[0]+'</span><div class="tb"><i style="width:'+t[1]+'%"></i></div><span style="width:36px;text-align:right;font-weight:700">'+t[1]+'%</span></div>';}).join('')+'</div><div class="cap">推荐流量占主导，说明算法在助推——保持更新节奏。</div>'+lockEl('starter')+'</div>';
    var pFun='<div class="apanel"><h3>⚡ 互动 → 应援漏斗 '+tierBadge('growth')+'</h3><div style="margin-top:6px">'
      +fr.map(function(r,i){return '<div class="funnel-row"><span class="lab">'+r[0]+'</span><div style="flex:1;height:24px;border-radius:7px;background:rgba(255,255,255,.05);overflow:hidden"><div style="width:'+Math.max(r[2],5)+'%;height:100%;border-radius:7px;background:'+fcol[i]+'"></div></div><span style="width:46px;text-align:right;font-weight:700">'+r[1]+'</span></div>';}).join('')
      +'</div><div class="cap">每 1000 次播放带来 <b style="color:#f5b8ab">0.9 位新应援者</b> —— StreamPump 独有：看内容直接转化为势能。</div>'+lockEl('growth')+'</div>';
    var pTime='<div class="apanel"><h3>🕗 最佳发布时间 '+tierBadge('growth')+'</h3>'
      +'<div style="font-size:13px;margin-top:10px">你的粉丝最活跃：<b style="color:#fff">周五 20:00–22:00</b></div>'
      +'<div style="display:flex;gap:3px;margin-top:12px;align-items:flex-end;height:56px">'+[30,42,55,38,60,88,74].map(function(v,i){var hot=i===5;return '<div style="flex:1;height:'+v+'%;border-radius:3px;background:'+(hot?'linear-gradient(180deg,#f0795f,#de402a)':'rgba(255,255,255,.12)')+'"></div>';}).join('')+'</div>'
      +'<div style="display:flex;justify-content:space-between;font-size:9.5px;color:#5d6b82;margin-top:5px"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>'
      +'<div class="cap">下条建议安排在周五晚高峰，预计多 <b style="color:#fff">+18%</b> 触达。</div>'+lockEl('growth')+'</div>';
    var pStudio='<div class="apanel wide"><h3>🔁 账号级看板 & 导出 '+tierBadge('studio')+'</h3>'
      +'<div style="font-size:11.5px;color:#93a2bb;margin-top:8px;line-height:1.7">多内容横向对比 · 账号级势能/涨粉趋势 · CSV 导出 + 全量历史 · API 接入 / 优先支持。适合重度运营与团队。</div>'
      +'<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+['多内容对比','账号级趋势','CSV 导出','全量历史','API'].map(function(x){return '<span style="font-size:11px;color:#cbb3ff;background:rgba(184,144,255,.1);border:1px solid rgba(184,144,255,.28);border-radius:30px;padding:4px 11px">'+x+'</span>';}).join('')+'</div>'+lockEl('studio')+'</div>';
    document.getElementById('view').innerHTML=head+upsell+pPlay
      +'<div class="agrid" style="margin-top:14px">'+pHot+pTr+'</div>'
      +'<div style="margin-top:14px">'+pFol+'</div>'
      +'<div class="agrid" style="margin-top:14px">'+pPct+pRet+'</div>'
      +'<div class="agrid" style="margin-top:14px">'+pFun+pTime+'</div>'
      +'<div style="margin-top:14px">'+pStudio+'</div>';
  }

  /* ---------- DATA ---------- */
  function renderData(){
    document.getElementById('view').innerHTML='<div style="font-size:24px;font-weight:800">数据 <span style="font-size:14px;color:#7486a1;font-weight:600">看一眼就好</span></div>'
      +'<div style="display:flex;gap:12px;margin-top:18px"><div class="panel" style="flex:1;padding:18px"><div style="font-size:11px;color:#7486a1">势能 Momentum</div><div style="font-size:30px;font-weight:800">71 <span style="font-size:14px;color:#2fbf71">↗ +9</span></div><div style="margin-top:12px">'+svgArea(gen(3,22,30,92),'#2fbf71',110)+'</div><div style="font-size:10.5px;color:#7486a1;margin-top:8px">是发现信号，不是价格。</div></div>'
      +'<div class="panel" style="flex:1;padding:18px"><div style="font-size:11px;color:#7486a1">应援人数</div><div style="font-size:30px;font-weight:800">312</div><div style="font-size:12px;color:#2fbf71;margin-top:4px">本周 +48</div><div style="font-size:11px;color:#7486a1;margin-top:14px;line-height:1.6">应援越多、势能越高，越接近触发赞助商出资助你毕业。保持稳定更新是关键。</div></div></div>';
  }

  /* ---------- dispatch ---------- */
  function renderView(){
    var map={home:'ni-home',content:'ni-content',composer:'ni-content',analytics:'ni-content',opps:'ni-opps',oppDetail:'ni-opps',data:'ni-data'};
    ['ni-home','ni-content','ni-opps','ni-data'].forEach(function(k){document.getElementById(k).classList.toggle('on',map[state.view]===k);});
    document.getElementById('opp-dot').style.display=state.opps.some(function(o){return o.status==='pending';})?'block':'none';
    if(state.view==='home')renderHome();
    else if(state.view==='content')renderContent();
    else if(state.view==='composer')renderComposer();
    else if(state.view==='opps')renderOpps();
    else if(state.view==='oppDetail')renderOppDetail();
    else if(state.view==='analytics')renderAnalytics();
    else if(state.view==='data')renderData();
    window.scrollTo({top:0});
  }
  function go(v){state.view=v;renderView();}
  var toastT;
  function flash(m){var el=document.getElementById('toast');el.innerText=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},2600);}
  renderView();
</script>
</body>
</html>
