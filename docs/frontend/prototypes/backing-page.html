        +'<div class="pf-c red"><div class="k">🎁 可领发现奖励</div><div class="v">2 笔 · 还剩 18h</div></div></div>'
      +'<div class="pf-tbl"><div class="pf-h" style="display:grid;grid-template-columns:1.8fr 1fr 1.2fr .9fr 1fr 100px;gap:10px"><div>创作者</div><div>应援于</div><div>我的入场</div><div>当前势能</div><div>状态</div><div></div></div>'
      +rows.map(function(r){var c=cr(r[0]);var a=actMap[r[4]];var rb=r[3]?'<span style="font-size:10px;color:'+(r[3]==='★'?'#7ce0b0':'#f5b8ab')+'">'+(r[3]==='★'?'★创始':'🐦早鸟')+'</span>':'';
        return '<div class="pf-tr row" onclick="openCreator(\''+c.id+'\')"><div style="display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;border-radius:9px;flex:none;background:'+hero(c)+';border:1px solid rgba(255,255,255,.12)"></span><span style="font-size:14px;font-weight:700">'+c.name+'</span></div>'
          +'<div style="font-size:12.5px;color:#93a2bb">'+r[1]+'</div><div style="font-size:12.5px">第 <b>'+r[2]+'</b> 位 '+rb+'</div><div style="font-size:14px;font-weight:700">'+c.mom+'</div><div>'+sb(c.stage,false)+'</div>'
          +'<div class="pf-act" style="color:'+a[1]+';background:'+a[2]+';border:1px solid '+a[3]+'" onclick="event.stopPropagation();flash(\''+(r[4]==='claim'?'领取发现奖励（预览）':r[4]==='add'?'去加码（预览）':'看赞助活动（下一步）')+'\')">'+a[0]+'</div></div>';
      }).join('')+'</div>'
      +'<div class="rediscover"><span style="font-size:18px">👀</span><div style="flex:1;font-size:12.5px;color:#9fd0ff">你关注过 <b>@court_vision</b>，本周势能 ↗ +17、冲刺毕业中。要趁早鸟位还在时应援吗？</div>'
        +'<div style="font-size:12.5px;font-weight:700;border:1px solid rgba(103,184,255,.5);color:#9fd0ff;border-radius:80px;padding:7px 16px;cursor:pointer" onclick="openCreator(\'court_vision\')">去看看</div></div>';
    document.getElementById('view').innerHTML=html;
  }

  var toastT;
  function flash(m){var el=document.getElementById('toast');el.innerText=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},2600);}

  renderClaim();renderView();renderOnboarding();
</script>
</body>
</html>
