[toolchain]
package_manager = "npm"
solana_version = "2.3.0"

[features]
seeds = false
skip-lint = false

[programs.localnet]
streampump_core = "FYphzoVLs1MB7aqHbGeT2DjqwTz1d6yyhtKXzvmjiDmp"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/streampump-core"]

[test]
startup_wait = 120000

[scripts]
test = "yarn ts-mocha -p ./tsconfig.json -t 1000000 programs/tests/**/*.spec.ts"
